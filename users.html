<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management | Laboratory Asset System</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/dashboard.css">
    <link rel="stylesheet" href="../../css/forms.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="app-layout">
        <aside id="app-sidebar" class="sidebar"></aside>

        <div class="main-wrapper">
            <header class="top-header">
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <button id="btn-mobile-menu" class="mobile-menu-btn" aria-label="Toggle menu">&#9776;</button>
                    <nav class="header-breadcrumbs">
                        <a href="../../dashboard.html">Laboratory</a>
                        <span class="separator">/</span>
                        <a href="../../dashboard.html">Admin</a>
                        <span class="separator">/</span>
                        <span id="header-breadcrumb-current" class="current">User Accounts</span>
                    </nav>
                </div>
                <div class="header-actions">
                    <div id="header-conn-status"></div>
                </div>
            </header>

            <main class="content-body">
                <div class="page-title-row">
                    <div>
                        <h1>User &amp; Role Management</h1>
                        <p>Manage laboratory personnel profiles, authorization roles, and account active/inactive statuses.</p>
                    </div>
                </div>

                <div class="table-card">
                    <div class="table-toolbar">
                        <div class="toolbar-search">
                            <span class="search-icon">🔍</span>
                            <input type="text" id="users-search" placeholder="Search by name, email or role...">
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Full Name</th>
                                    <th>Email Address</th>
                                    <th>Assigned Role</th>
                                    <th>Status</th>
                                    <th>Registration Date</th>
                                    <th class="actions-col">Account Control</th>
                                </tr>
                            </thead>
                            <tbody id="users-table-body">
                                <tr><td colspan="6" class="empty-state">Loading user profiles...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script type="module" src="../../js/app.js?v=2.6"></script>
</body>
</html>
