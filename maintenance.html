<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance Tickets | Laboratory Staff</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/dashboard.css">
    <link rel="stylesheet" href="../../css/forms.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="app-layout">
        <aside id="app-sidebar" class="sidebar"></aside>

        <div class="main-wrapper">
            <header class="top-header">
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <button id="btn-mobile-menu" class="mobile-menu-btn" aria-label="Toggle menu">&#9776;</button>
                    <nav class="header-breadcrumbs">
                        <a href="../../dashboard.html">Laboratory</a>
                        <span class="separator">/</span>
                        <a href="../../dashboard.html">Staff</a>
                        <span class="separator">/</span>
                        <span id="header-breadcrumb-current" class="current">Maintenance Tickets</span>
                    </nav>
                </div>
                <div class="header-actions">
                    <div id="header-conn-status"></div>
                </div>
            </header>

            <main class="content-body">
                <div class="page-title-row">
                    <div>
                        <h1>Equipment Maintenance Tickets</h1>
                        <p>Submit malfunction tickets for damaged laboratory assets and view active maintenance status.</p>
                    </div>
                    <button id="btn-new-maintenance" class="btn btn-warning">
                        <span>🔧 Report Equipment Issue</span>
                    </button>
                </div>

                <div class="table-card">
                    <div class="table-responsive">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Ticket ID</th>
                                    <th>Equipment Asset</th>
                                    <th>Problem Description</th>
                                    <th>Reported By</th>
                                    <th>Status</th>
                                    <th>Remarks</th>
                                    <th class="actions-col">Assigned Tech</th>
                                </tr>
                            </thead>
                            <tbody id="maintenance-table-body">
                                <tr><td colspan="7" class="empty-state">Loading maintenance tickets...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script type="module" src="../../js/app.js?v=2.6"></script>
</body>
</html>
